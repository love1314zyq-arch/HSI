seed: 1993
device: cuda:0
batch_size: 64
num_workers: 0
learning_rate: 0.0005
weight_decay: 0.0005
epochs_base: 60
epochs_inc: 100
print_freq: 10
save_path: checkpoints/salinas_step4b_bestselect
log_path: logs/salinas_step4b_bestselect
output_path: outputs/salinas_step4b_bestselect

incremental:
  total_classes: 16
  base_classes: 8
  task_num: 2

data:
  root: data/Salinas
  train_ratio: 0.2
  patch_size: 11
  pca_dim: 30

model:
  backbone: hybrid_hsi_lite
  feature_dim: 512

classifier:
  type: cosine
  cosine_scale: 16.0

train:
  optimizer: adamw
  scheduler: cosine

pass:
  temp: 0.1
  protoAug_weight: 10.0
  kd_weight: 10.0
  use_rotation_ssl: true

task_selection:
  enable_best_model: true
  early_stop_min_epochs: 10
  early_stop_drop_ratio: 0.1
  metric: oa

replay:
  enable: false
  memory_per_class: 40
  batch_size: 64
  lambda_replay: 1.0
  lambda_align: 0.0

bias_correction:
  enable: true

balanced_finetune:
  enable: false
  epochs: 6
  learning_rate: 0.0005
