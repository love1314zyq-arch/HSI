seed: 1993
device: cuda:0
batch_size: 64
num_workers: 0
learning_rate: 0.0005
weight_decay: 0.0005
epochs_base: 60
epochs_inc: 100
print_freq: 10
save_path: checkpoints/indianpines_step4b_ssma_rawreplay_herding_merged_bestselect_protoaug_hsi_budget480_fullreplay10
log_path: logs/indianpines_step4b_ssma_rawreplay_herding_merged_bestselect_protoaug_hsi_budget480_fullreplay10
output_path: outputs/indianpines_step4b_ssma_rawreplay_herding_merged_bestselect_protoaug_hsi_budget480_fullreplay10

incremental:
  total_classes: 16
  base_classes: 8
  task_num: 2

data:
  root: data/IndianPines
  train_ratio: 0.2
  patch_size: 13
  pca_dim: 30

model:
  backbone: hybrid_hsi_lite
  feature_dim: 512

classifier:
  type: cosine
  cosine_scale: 16.0

train:
  optimizer: adamw
  scheduler: cosine

pass:
  temp: 0.1
  protoAug_weight: 10.0
  kd_weight: 10.0
  ssl_mode: ssma
  use_rotation_ssl: false
  prototype_aug_mode: spectral_diag
  prototype_aug_diag_floor_ratio: 0.15

task_selection:
  enable_best_model: true
  early_stop_min_epochs: 10
  early_stop_drop_ratio: 0.1
  metric: oa

replay:
  enable: true
  mode: raw
  strategy: merged
  selection: herding
  memory_per_class: 20
  fixed_budget: true
  memory_budget: 480
  full_replay_below_train_count: 10
  min_memory_per_class: 5
  batch_size: 64
  lambda_replay: 1.0
  lambda_align: 0.0

bias_correction:
  enable: true

balanced_finetune:
  enable: false
  epochs: 6
  learning_rate: 0.0005
