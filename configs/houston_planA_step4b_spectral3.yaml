seed: 1993
device: cuda:0
batch_size: 64
num_workers: 0
learning_rate: 0.0005
weight_decay: 0.0005
epochs_base: 60
epochs_inc: 100
print_freq: 10
save_path: checkpoints/houston_step4b_spectral3
log_path: logs/houston_step4b_spectral3
output_path: outputs/houston_step4b_spectral3

incremental:
  total_classes: 7
  base_classes: 5
  task_num: 1

data:
  root: data/Houston
  train_ratio: 0.2
  patch_size: 11
  pca_dim: 30

model:
  backbone: hybrid_hsi_lite
  feature_dim: 512

classifier:
  type: cosine
  cosine_scale: 16.0

train:
  optimizer: adamw
  scheduler: cosine

pass:
  temp: 0.1
  protoAug_weight: 10.0
  kd_weight: 10.0
  ssl_mode: spectral3
  use_rotation_ssl: false

replay:
  enable: false
  memory_per_class: 40
  batch_size: 64
  lambda_replay: 1.0
  lambda_align: 0.0

bias_correction:
  enable: true

balanced_finetune:
  enable: false
  epochs: 6
  learning_rate: 0.0005
